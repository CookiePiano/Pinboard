name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 23 * * 0'

permissions:
  contents: read

jobs:
  windows:
    name: security-windows
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
      - name: Install the pinned build and audit tools
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/pinboard-security-target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.99.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo install cargo-audit --version 0.22.2 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/prepare-tools.ps1 -Tools gitleaks -Directory "$env:RUNNER_TEMP/pinboard-tools"
          "$env:RUNNER_TEMP/pinboard-tools/gitleaks" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Audit dependencies and verify security boundaries
        shell: pwsh
        run: ./scripts/security-check.ps1
